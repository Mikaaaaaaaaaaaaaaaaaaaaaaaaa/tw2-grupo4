<nav class="nav">
  <!-- Logo y nombre -->
  <a class="container-logo" routerLink="/">
    <img
      src="https://i.scdn.co/image/ab67616d00001e02331d2c8543d7d994c2215a65"
      alt="Logo de TechStore"
      class="logo"
    />
    <span class="brand-name">TechStore</span>
  </a>

  <div class="sesion">
    <span class="sesion-nombre">
      <i class="fas fa-user" aria-hidden="true"></i>
      {{ nombreUsuario ?? 'Invitado' }}
    </span>

    @if (nombreUsuario) {
      <button type="button" class="sesion-btn secundario" (click)="cerrarSesion()">
        Cerrar sesión
      </button>
    } @else {
      <button type="button" class="sesion-btn" (click)="abrirLogin()">Iniciar sesión</button>
    }
  </div>

  <!-- Navegación -->
  <ul class="nav-list">
    <li>
      <a
        class="nav-link"
        routerLink="/catalogo"
        routerLinkActive="nav-link--active"
        [routerLinkActiveOptions]="{ exact: true }"
      >
        <i class="fas fa-store nav-icon" aria-hidden="true"></i>
        Catálogo
      </a>
    </li>

    <li>
      <a
        class="nav-link"
        routerLink="/mis-pedidos"
        routerLinkActive="nav-link--active"
        [routerLinkActiveOptions]="{ exact: true }"
      >
        <i class="fas fa-receipt nav-icon" aria-hidden="true"></i>
        <span>Mis pedidos</span>
      </a>
    </li>

    <li>
      @if (login.esAdmin()) {
        <a
          class="nav-link"
          routerLink="/productos/nuevo"
          routerLinkActive="nav-link--active"
          [routerLinkActiveOptions]="{ exact: true }"
        >
          <i class="fas fa-plus nav-icon" aria-hidden="true"></i>
          <span>Cargar producto</span>
        </a>
      }
    </li>

    <li class="cart-item">
      <app-carrito></app-carrito>
    </li>
  </ul>
</nav>

@if (mostrarLogin) {
  <app-login (cerrar)="cerrarLogin()" (autenticado)="alAutenticar()"></app-login>
}
